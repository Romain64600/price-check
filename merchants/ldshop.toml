# LDShop (ldshop.gg) — étude du 01/10/2026, Forza Horizon 6 Premium Upgrade Bundle.
# Une même page regroupe plusieurs produits (Standard, Deluxe, Premium, Premium Upgrade…) ; le lien
# AllKeyShop en choisit un par « skuId ». Le titre de la page est celui du jeu de base : on lit en plus
# l'option choisie (bouton role="radio" aria-checked="true"). Page derrière une protection : Chromium.
name = "LDShop"
hosts = ["ldshop.gg"]

[page]
parser = "selected-option"
