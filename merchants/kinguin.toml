# Kinguin (kinguin.net) — groupe des marchands dont les redirections ne se suivent pas (Romain, 02/10/2026) :
# « Kinguin redirige vers une autre offre quand l'offre est out of stock, donc pour Kinguin on ne se fie pas aux
# redirections. » Une redirection (ou une fiche servie sous une autre URL canonique) mène à UNE AUTRE OFFRE : elle ne
# dit rien de l'offre AllKeyShop. Le moniteur juge le lien lui-même ; la cible d'une redirection ne sert ni à accuser
# (« autre produit ») ni à blanchir le nom.
# Cas fondateur, Stellaris Bundle 1 (offre 135046199, 01/10/2026) : lien « …/172478/stellaris-starter-pack-eu-steam-cd-key »
# affiché GLOBAL, Kinguin sert la fiche globale (« …-starter-pack-bundle-2023-pc-steam-cd-key »). Romain : « C'est bien EU
# même si maintenant ça redirige sur l'offre globale », faux positif, le marchand doit passer l'offre EU en rupture dans
# son feed. Depuis le 02/10 (Romain : « on aura quand même une alerte »), une redirection constatée donne l'alerte
# « offre en rupture chez le marchand : le lien redirige vers une autre fiche, mais le prix reste dans le feed » ; la
# RÉGION n'est plus reprochée quand la fiche servie (ce que l'acheteur obtient) correspond à l'affichage.
# Détection (02/10) : une requête HTTP par offre, sans suivre la redirection, avec les en-têtes complets de Chrome (Akamai
# répond 403 sinon) : 200 = fiche en stock, 301 vers une autre fiche = rupture. Plus besoin de Chromium pour Kinguin.
# D'autres marchands rejoindront ce groupe au fil de l'apprentissage : copier ce fichier.
name = "Kinguin"
hosts = ["kinguin.net"]

[redirect]
means = "out-of-stock"  # l'autre groupe (défaut) : la redirection mène à la fiche actuelle de la même offre (Instant Gaming)
