# Autres noms d'un produit, appris au fil de la formation (titre européen, titre localisé...).
# Clé : le nom AllKeyShop (sans le suffixe de plateforme) ; valeur : les noms utilisés par les marchands.

[products]
# Rhythm Heaven s'appelle Rhythm Paradise en Europe (Loaded, 30/09/2026)
"Rhythm Heaven Groove" = ["Rhythm Paradise Groove"]
# Titres français d'Amazon.fr, vérifiés le 30/09/2026 (titres officiels Nintendo en France)
"Kirby and the Forgotten Land" = ["Kirby et le monde oublié"]
"Pokemon Sword" = ["Pokémon Épée"]
"Pokémon Brilliant Diamond" = ["Pokémon Diamant Étincelant"]
# K4G écrit « Booster Courses Pack » pour le Booster Course Pass (page : « This is a DLC… Mario Kart 8 Deluxe –
# Booster Course Pass », 01/10/2026, Top Offers)
"Mario Kart 8 Deluxe Booster Course Pass" = ["Mario Kart 8 Deluxe Booster Courses Pack"]
# « Warcraft Forever » (Driffle) pour World of Warcraft: Forever n'est plus un alias depuis le 02/10/2026 : le préfixe
# « World of » est facultatif pour tous les produits (OPTIONAL_PREFIXES dans price_check.py).
# Titre de travail de Tears of the Kingdom, gardé dans l'URL Instant Gaming (« …-breath-of-the-wild-2 », 02/10/2026)
"The Legend of Zelda Tears of the Kingdom" = ["The Legend of Zelda Breath of the Wild 2"]
# Le jeu s'appelle désormais « Crimson Desert Enhanced » (PS Store, Kinguin « crimson-desert-enhanced-… », 02/10/2026)
"Crimson Desert" = ["Crimson Desert Enhanced"]
# Instant Gaming vend l'édition « Hatred Edition » de Diablo 4 Lord of Hatred sous le nom « Diablo IV: Age of Hatred
# Collection » (étude des 80 reports, 30/09/2026 ; offre 139777205). Depuis le 02/10/2026, un mot du nom remplacé par un
# autre (« Age » pour « Lord ») n'est plus toléré : l'alias garde ce cas OK. Confirmé par Romain le 05/10/2026 (même édition).
"Diablo 4 Lord of Hatred" = ["Diablo IV Age of Hatred"]
# Gamingdragons écrit « dynasty-warriors-3-complete-edition » pour le remaster (le Dynasty Warriors 3 d'origine n'a jamais
# été vendu en clé PC) ; depuis le 02/10/2026, « Remastered » compte dans le nom (l'original n'est pas le remaster).
"Dynasty Warriors 3 Complete Edition Remastered" = ["Dynasty Warriors 3 Complete Edition"]
# Resident Evil Requiem est le 9e épisode : Gamingdragons écrit « resident-evil-requiem-9 » (un numéro après le nom ne
# passe plus depuis le 02/10/2026 : c'est d'ordinaire une suite)
"Resident Evil Requiem" = ["Resident Evil Requiem 9", "Resident Evil 9 Requiem"]
# Le DLC « The Hidden Treasure of Area Zero » existe pour Pokémon Scarlet et pour Pokémon Violet ; la page AllKeyShop
# « Pokemon Scarlet The Hidden Treasure of Area Zero » prend en compte les deux (il n'y a pas de page Violet : 404).
# Romain, 03/10/2026 : faux positif (GameBoost, offre 138007132, alertée « en doute » le 02/10) — « c'est des cas
# rares, spécifique à Pokémon, donc vraiment, vraiment pas généraliser » : un alias pour ce seul produit ; la règle
# « un autre mot à la place d'un mot du nom = un autre produit » reste (le jeu Pokémon Violet n'est pas Scarlet).
"Pokemon Scarlet The Hidden Treasure of Area Zero" = ["Pokemon Violet The Hidden Treasure of Area Zero"]
